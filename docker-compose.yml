services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: penggajian-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_PORT: "8090"
    volumes:
      - uploads:/app/uploads
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  uploads:
    driver: local
